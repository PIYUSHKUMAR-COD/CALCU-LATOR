<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAL-CULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="cal-logo"></div>
        <h1>Calculator</h1>
    </div>
    <div class="display">
        <div class="input">0</div>
        <div class="result">0</div>
    </div>
    <div class="btns1" id="btn">
       <button class="clear">C</button>
       <button class="cross"></button>
       <button>%</button>
       <button id="opreater">/</button>
    </div>
     <div class="btns2" id="btn">
        <button>7</button>
         <button>8</button>
          <button>9</button>
           <button id="opreater">*</button>
     </div>
      <div class="btns3" id="btn">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button id="opreater">-</button>
      </div>
       <div class="btns4"id="btn">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button id="opreater">+</button>
       </div>
        <div class="btns5" id="btn">
            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
        </div>
</div>
</body>
<script src="script.js"></script>
</html>
